name: Daily poopanthropists

on:
  schedule:
    # 00:30 UTC ≈ 6:00 AM IST
    - cron: "30 0 * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Fetch daily picks (6+ India)
        working-directory: web
        run: npm run fetch:daily-villains

      - name: Commit and push updated batch
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/data/daily-villains.json
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to daily-villains.json"
            exit 0
          fi
          git commit -m "chore: refresh daily poopanthropists batch"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Vercel redeploy
        if: steps.commit.outputs.changed == 'true'
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK" ]; then
            echo "Deploying via hook..."
            curl -fsS -X POST "$VERCEL_DEPLOY_HOOK"
          elif [ -n "$VERCEL_TOKEN" ]; then
            echo "Deploying via Vercel CLI (repo root; project rootDirectory=web)..."
            npx vercel deploy --prod --token "$VERCEL_TOKEN" --yes
          else
            echo "No VERCEL_DEPLOY_HOOK or VERCEL_TOKEN — commit pushed; redeploy manually or add secret."
          fi
