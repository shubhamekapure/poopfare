name: Daily poopanthropists

on:
  schedule:
    # 00:30 UTC ≈ 6:00 AM IST
    - cron: "30 0 * * *"
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Fetch daily picks (6+ India)
        run: npm run fetch:daily-villains

      - name: Commit updated batch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/daily-villains.json
          if git diff --staged --quiet; then
            echo "No changes to daily-villains.json"
            exit 0
          fi
          git commit -m "chore: refresh daily poopanthropists batch"

      - name: Push changes
        run: git push

      - name: Trigger Vercel redeploy
        if: env.VERCEL_DEPLOY_HOOK != ''
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: curl -fsS -X POST "$VERCEL_DEPLOY_HOOK"
